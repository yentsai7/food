<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>食光記帳本 2.0 - 智慧飲食記帳與熱量分析</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF7F2;
            --card-bg: #FFFFFF;
            --primary-green: #5B8C5A;
            --primary-green-hover: #4A7349;
            --accent-orange: #E88D67;
            --accent-yellow: #F4D35E;
            --danger-red: #D9534F;
            --text-main: #2C3E2D;
            --text-secondary: #6B7C6C;
            --border-color: #E2E8E2;
            --shadow: 0 4px 15px rgba(91, 140, 90, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--primary-green);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* 頂部設定與進度條區塊 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--primary-green);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .goal-settings {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            align-items: center;
            font-size: 0.9rem;
        }

        .goal-settings input {
            width: 90px;
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: right;
        }

        .progress-bar-container {
            background-color: #EDF2ED;
            border-radius: 10px;
            height: 14px;
            width: 100%;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s ease, background-color 0.4s ease;
            border-radius: 10px;
        }

        .stats-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* 主要操作與內容區 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 表單與快速選單 */
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background-color: #FAFAFA;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-green);
            background-color: #FFF;
            box-shadow: 0 0 0 3px rgba(91, 140, 90, 0.12);
        }

        /* 智慧比對提示下拉選單 */
        .autocomplete-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #FFFFFF;
            border: 1px solid var(--primary-green);
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            z-index: 50;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            margin-top: 4px;
        }

        .autocomplete-item {
            padding: 9px 12px;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #F0F4F0;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover {
            background-color: #EBF2EA;
        }

        .auto-match-badge {
            font-size: 0.78rem;
            color: var(--primary-green);
            background-color: #EBF2EA;
            padding: 2px 8px;
            border-radius: 10px;
            display: none;
        }

        .meal-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .meal-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
            background-color: #F7F9F7;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .meal-tab.active {
            background-color: var(--primary-green);
            color: white;
            border-color: var(--primary-green);
        }

        .quick-food-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
            max-height: 95px;
            overflow-y: auto;
            padding: 2px;
        }

        .quick-food-tag {
            background-color: #EBF2EA;
            color: var(--primary-green);
            border: 1px solid #D2E3D1;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-food-tag:hover {
            background-color: var(--primary-green);
            color: white;
        }

        /* 開啟熱量總表按鈕 */
        .open-table-btn {
            background-color: #FFF5EE;
            color: #D97246;
            border: 1px dashed var(--accent-orange);
            padding: 8px 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .open-table-btn:hover {
            background-color: var(--accent-orange);
            color: white;
            border-style: solid;
        }

        .btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-green-hover);
        }

        .btn-secondary {
            background-color: #E2E8E2;
            color: var(--text-main);
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #D1DCD1;
        }

        /* 紀錄清單 */
        .record-list {
            max-height: 350px;
            overflow-y: auto;
            margin-top: 10px;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: #F8FAF8;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .record-info div:first-child {
            font-weight: 500;
        }

        .record-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .record-price-cal {
            text-align: right;
            font-size: 0.85rem;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-red);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px;
            font-size: 0.9rem;
        }

        /* 圖表與分析區塊 */
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-box {
            text-align: center;
        }

        .chart-box h4 {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        canvas {
            max-width: 140px;
            max-height: 140px;
            margin: 0 auto;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        /* 彈出式「熱量參考總表」Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.45);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .modal-header {
            padding: 16px 20px;
            background-color: var(--primary-green);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            color: white;
            margin: 0;
            font-size: 1.15rem;
        }

        .close-modal-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 18px 20px;
            overflow-y: auto;
        }

        .modal-search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .modal-search-bar input {
            flex: 1;
            min-width: 180px;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .modal-search-bar select {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            background-color: #FFF;
        }

        .food-ref-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }

        .food-ref-table th, .food-ref-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        .food-ref-table th {
            background-color: #F4F7F4;
            color: var(--text-main);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        .food-ref-table tr:hover {
            background-color: #F8FBF8;
        }

        .use-food-btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .use-food-btn:hover {
            background-color: var(--primary-green-hover);
        }

        .external-link-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #FAF7F2;
            border-radius: 10px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .external-link-box a {
            color: var(--primary-green);
            font-weight: 600;
            text-decoration: none;
        }

        .external-link-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🥑 食光記帳本 2.0</h1>
        <p>智慧比對台灣外食熱量，輕鬆掌握每日花費與卡路里平衡</p>
    </header>

    <!-- 頂部儀表板：雙重目標進度條 -->
    <div class="dashboard-grid">
        <!-- 預算卡片 -->
        <div class="card">
            <h3>
                <span>💰 每日花費預算</span>
                <span id="budget-status-text" style="font-size: 0.85rem; font-weight: normal;"></span>
            </h3>
            <div class="goal-settings">
                <label for="budget-limit">設定預算 (元)：</label>
                <input type="number" id="budget-limit" value="300" min="0" step="50" onchange="updateGoals()">
            </div>
            <div class="progress-bar-container">
                <div id="budget-progress" class="progress-bar"></div>
            </div>
            <div class="stats-text">
                <span>已花費：<strong id="total-spent">0</strong> 元</span>
                <span>剩餘：<strong id="budget-left">300</strong> 元</span>
            </div>
        </div>

        <!-- 熱量卡片 -->
        <div class="card">
            <h3>
                <span>🔥 每日熱量攝取</span>
                <span id="calorie-status-text" style="font-size: 0.85rem; font-weight: normal;"></span>
            </h3>
            <div class="goal-settings">
                <label for="calorie-limit">設定上限 (大卡)：</label>
                <input type="number" id="calorie-limit" value="1800" min="0" step="100" onchange="updateGoals()">
            </div>
            <div class="progress-bar-container">
                <div id="calorie-progress" class="progress-bar"></div>
            </div>
            <div class="stats-text">
                <span>已攝取：<strong id="total-calories">0</strong> kcal</span>
                <span>剩餘：<strong id="calorie-left">1800</strong> kcal</span>
            </div>
        </div>
    </div>

    <!-- 主要操作區 -->
    <div class="main-grid">
        <!-- 左側：新增飲食表單 -->
        <div class="card">
            <h3>📝 新增飲食與記帳</h3>
            
            <div class="form-group">
                <label>選擇餐別</label>
                <div class="meal-tabs">
                    <div class="meal-tab active" onclick="setMeal('早餐', this)">早餐</div>
                    <div class="meal-tab" onclick="setMeal('午餐', this)">午餐</div>
                    <div class="meal-tab" onclick="setMeal('晚餐', this)">晚餐</div>
                    <div class="meal-tab" onclick="setMeal('點心/飲料', this)">點心/飲料</div>
                </div>
            </div>

            <div class="form-group">
                <label>⚡ 熱門外食快速點選</label>
                <div class="quick-food-container" id="quick-food-list">
                    <!-- JavaScript 動態帶入精選標籤 -->
                </div>
            </div>

            <!-- 開啟完整食物熱量參考總表按鈕 -->
            <button type="button" class="open-table-btn" onclick="openModal()">
                📖 不知道熱量嗎？點此展開「常見食物熱量參考總表」(40+種)
            </button>

            <div class="form-group">
                <label for="food-name">
                    <span>食物名稱（輸入關鍵字可自動比對資料庫）</span>
                    <span id="auto-match-hint" class="auto-match-badge">✨ 已自動帶入參考值</span>
                </label>
                <input type="text" id="food-name" placeholder="試著輸入：水餃、雞排、拿鐵、滷肉飯..." autocomplete="off" oninput="handleFoodInput(this.value)">
                <!-- 智慧比對下拉建議 -->
                <div id="autocomplete-list" class="autocomplete-box"></div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label for="food-price">花費金額 (元)</label>
                    <input type="number" id="food-price" placeholder="0" min="0">
                </div>
                <div class="form-group">
                    <label for="food-cal">熱量 (大卡)</label>
                    <input type="number" id="food-cal" placeholder="0" min="0">
                </div>
            </div>

            <button class="btn" onclick="addRecord()">＋ 加入今日紀錄</button>

            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="loadDemoData()">✨ 載入範例資料 (Demo)</button>
                <button class="btn btn-secondary" onclick="clearAllData()" style="color: var(--danger-red);">🗑️ 清空紀錄</button>
            </div>
        </div>

        <!-- 右側：今日紀錄清單與圓餅圖分析 -->
        <div class="card">
            <h3>📊 今日飲食清單與分析</h3>
            
            <!-- 圓餅圖容器 -->
            <div class="charts-container">
                <div class="chart-box">
                    <h4>各餐花費佔比 (元)</h4>
                    <canvas id="costChart" width="130" height="130"></canvas>
                </div>
                <div class="chart-box">
                    <h4>各餐熱量佔比 (kcal)</h4>
                    <canvas id="calorieChart" width="130" height="130"></canvas>
                </div>
            </div>

            <hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h4 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 8px;">明細清單</h4>
            <div class="record-list" id="record-list-container">
                <!-- 動態生成的紀錄列表 -->
            </div>
        </div>
    </div>
</div>

<!-- 彈出式「常見食物熱量參考總表」Modal -->
<div class="modal-overlay" id="calorie-modal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
        <div class="modal-header">
            <h3>📖 台灣常見外食熱量與價格參考總表</h3>
            <button class="close-modal-btn" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="modal-search-bar">
                <input type="text" id="modal-search-input" placeholder="🔍 搜尋食物名稱（如：便當、麵、奶茶...）" oninput="renderModalTable()">
                <select id="modal-category-filter" onchange="renderModalTable()">
                    <option value="全部">所有分類</option>
                    <option value="早餐">☀️ 早餐店</option>
                    <option value="便當與主食">🍱 便當與主食</option>
                    <option value="超商與輕食">🏪 超商與輕食</option>
                    <option value="小吃與宵夜">🍢 小吃與宵夜</option>
                    <option value="手搖飲與咖啡">🧋 手搖飲與咖啡</option>
                </select>
            </div>

            <div style="max-height: 360px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 8px;">
                <table class="food-ref-table">
                    <thead>
                        <tr>
                            <th>分類</th>
                            <th>食物名稱 (份量)</th>
                            <th>參考價格</th>
                            <th>參考熱量</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="modal-table-body">
                        <!-- JS 動態渲染 -->
                    </tbody>
                </table>
            </div>

            <!-- 外部權威熱量資料庫連結 -->
            <div class="external-link-box">
                <span>💡 找不到你吃的特殊食物嗎？可前往官方資料庫查詢：</span>
                <div>
                    <a href="https://consumer.fda.gov.tw/Food/TFND.aspx?nodeID=178" target="_blank" rel="noopener">🔗 衛福部食藥署「食品營養成分資料庫」↗</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 引入 Chart.js 繪製圓餅圖 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // 擴充版資料庫：42 種台灣常見外食（含分類、價格、熱量）
    const foodDatabase = [
        // 早餐
        { category: "早餐", name: "原味蛋餅", price: 35, cal: 320, popular: true },
        { category: "早餐", name: "起司蛋餅", price: 45, cal: 420 },
        { category: "早餐", name: "薯餅蛋餅", price: 50, cal: 530 },
        { category: "早餐", name: "豬肉滿福堡加蛋", price: 60, cal: 390 },
        { category: "早餐", name: "火腿蛋吐司", price: 45, cal: 380 },
        { category: "早餐", name: "卡啦雞腿堡", price: 75, cal: 680 },
        { category: "早餐", name: "鐵板麵加蛋", price: 65, cal: 650 },
        { category: "早餐", name: "蘿蔔糕 (2片)", price: 35, cal: 240 },
        { category: "早餐", name: "飯糰 (傳統)", price: 45, cal: 520 },
        { category: "早餐", name: "無糖豆漿 (中杯)", price: 25, cal: 140, popular: true },
        { category: "早餐", name: "早餐店大冰奶", price: 35, cal: 350 },

        // 便當與主食
        { category: "便當與主食", name: "炸雞腿便當", price: 115, cal: 880, popular: true },
        { category: "便當與主食", name: "滷雞腿便當", price: 110, cal: 730 },
        { category: "便當與主食", name: "炸排骨便當", price: 105, cal: 850 },

        { category: "手搖飲與咖啡", name: "冰拿鐵咖啡 (無糖)", price: 65, cal: 160 }
    ];

    let currentMeal = "早餐";
    let records = JSON.parse(localStorage.getItem('eat_budget_records')) || [];
    let userBudget = JSON.parse(localStorage.getItem('eat_budget_limit')) || 300;
    let userCalorieLimit = JSON.parse(localStorage.getItem('eat_calorie_limit')) || 1800;

    let costChartInstance = null;
    let calorieChartInstance = null;

    // 初始化頁面
    window.onload = function() {
        document.getElementById('budget-limit').value = userBudget;
        document.getElementById('calorie-limit').value = userCalorieLimit;
        renderQuickFoodTags();
        renderModalTable();
        updateUI();

        // 點擊頁面空白處關閉下拉選單
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.form-group')) {
                document.getElementById('autocomplete-list').style.display = 'none';
            }
        });
    };

    // 設定餐別分頁
    function setMeal(meal, element) {
        currentMeal = meal;
        document.querySelectorAll('.meal-tab').forEach(tab => tab.classList.remove('active'));
        element.classList.add('active');
    }

    // 渲染快速美食標籤（挑出 popular 的項目）
    function renderQuickFoodTags() {
        const container = document.getElementById('quick-food-list');
        const popularFoods = foodDatabase.filter(f => f.popular);
        container.innerHTML = popularFoods.map(food => `
            <div class="quick-food-tag" onclick="selectQuickFood('${food.name}', ${food.price}, ${food.cal})">
                ${food.name} ($${food.price}/${food.cal}kcal)
            </div>
        `).join('');
    }

    // 點擊快速美食或總表項目自動帶入表單
    function selectQuickFood(name, price, cal) {
        document.getElementById('food-name').value = name;
        document.getElementById('food-price').value = price;
        document.getElementById('food-cal').value = cal;
        document.getElementById('autocomplete-list').style.display = 'none';
        showAutoMatchBadge();
    }

    // 顯示「已自動帶入參考值」提示徽章
    function showAutoMatchBadge() {
        const badge = document.getElementById('auto-match-hint');
        badge.style.display = 'inline-block';
        setTimeout(() => {
            badge.style.display = 'none';
        }, 2800);
    }

    // 智慧模糊搜尋與自動帶入（核心升級功能！）
    function handleFoodInput(keyword) {
        const cleanKey = keyword.trim();
        const listBox = document.getElementById('autocomplete-list');

        if (!cleanKey) {
            listBox.style.display = 'none';
            return;
        }

        // 比對資料庫
        const matches = foodDatabase.filter(item => item.name.includes(cleanKey));

        // 如果剛好完全匹配某項食物，直接自動幫填價格與熱量
        const exactMatch = foodDatabase.find(item => item.name === cleanKey);
        if (exactMatch) {
            document.getElementById('food-price').value = exactMatch.price;
            document.getElementById('food-cal').value = exactMatch.cal;
            showAutoMatchBadge();
        }

        if (matches.length > 0) {
            listBox.innerHTML = matches.map(item => `
                <div class="autocomplete-item" onclick="selectQuickFood('${item.name}', ${item.price}, ${item.cal})">
                    <span><strong>${item.name}</strong> <small style="color:#6B7C6C;">(${item.category})</small></span>
                    <span style="color:var(--primary-green); font-weight:500;">$${item.price} / ${item.cal} kcal</span>
                </div>
            `).join('');
            listBox.style.display = 'block';
        } else {
            listBox.innerHTML = `
                <div class="autocomplete-item" onclick="openModal()">
                    <span style="color:#6B7C6C;">找不到「${cleanKey}」？點此打開熱量參考總表或外部查詢</span>
                </div>
            `;
            listBox.style.display = 'block';
        }
    }

    // 開關「熱量參考總表」Modal
    function openModal() {
        document.getElementById('calorie-modal').style.display = 'flex';
        document.getElementById('autocomplete-list').style.display = 'none';
        renderModalTable();
    }

    function closeModal() {
        document.getElementById('calorie-modal').style.display = 'none';
    }

    function closeModalOnBg(event) {
        if (event.target.id === 'calorie-modal') {
            closeModal();
        }
    }

    // 渲染 Modal 內的食物參考總表
    function renderModalTable() {
        const searchKey = document.getElementById('modal-search-input').value.trim();
        const categoryFilter = document.getElementById('modal-category-filter').value;
        const tbody = document.getElementById('modal-table-body');

        const filtered = foodDatabase.filter(item => {
            const matchCategory = (categoryFilter === '全部') || (item.category === categoryFilter);
            const matchKeyword = item.name.includes(searchKey) || item.category.includes(searchKey);
            return matchCategory && matchKeyword;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:20px; color:#6B7C6C;">沒有找到符合的食物，可點擊下方衛福部資料庫連結查詢喔！</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(item => `
            <tr>
                <td><span style="font-size:0.78rem; background:#EBF2EA; color:#5B8C5A; padding:2px 7px; border-radius:8px;">${item.category}</span></td>
                <td><strong>${item.name}</strong></td>
                <td>$${item.price} 元</td>
                <td>${item.cal} kcal</td>
                <td>
                    <button class="use-food-btn" onclick="selectFromModal('${item.name}', ${item.price}, ${item.cal})">帶入</button>
                </td>
            </tr>
        `).join('');
    }

    function selectFromModal(name, price, cal) {
        selectQuickFood(name, price, cal);
        closeModal();
    }

    // 更新目標設定
    function updateGoals() {
        userBudget = parseFloat(document.getElementById('budget-limit').value) || 0;
        userCalorieLimit = parseFloat(document.getElementById('calorie-limit').value) || 0;
        localStorage.setItem('eat_budget_limit', JSON.stringify(userBudget));
        localStorage.setItem('eat_calorie_limit', JSON.stringify(userCalorieLimit));
        updateUI();
    }

    // 新增紀錄
    function addRecord() {
        const name = document.getElementById('food-name').value.trim();
        const price = parseFloat(document.getElementById('food-price').value);
        const cal = parseFloat(document.getElementById('food-cal').value);

        if (!name) {
            alert('請輸入或選擇食物名稱！');
            return;
        }
        if (isNaN(price) || price < 0 || isNaN(cal) || cal < 0) {
            alert('請輸入有效的花費金額與熱量數字！');
            return;
        }

        const newRecord = {
            id: Date.now(),
            meal: currentMeal,
            name: name,
            price: price,
            cal: cal
        };

        records.push(newRecord);
        saveAndRefresh();
        resetForm();
    }

    // 刪除紀錄
    function deleteRecord(id) {
        records = records.filter(record => record.id !== id);
        saveAndRefresh();
    }

    // 清空全部紀錄
    function clearAllData() {
        if (confirm('確定要清空今日所有的飲食與記帳紀錄嗎？')) {
            records = [];
            saveAndRefresh();
        }
    }

    // 載入範例資料 (Demo)
    function loadDemoData() {
        records = [
            { id: 1, meal: "早餐", name: "原味蛋餅 + 無糖豆漿", price: 60, cal: 460 },
            { id: 2, meal: "午餐", name: "炸雞腿便當", price: 115, cal: 880 },
            { id: 3, meal: "點心/飲料", name: "珍珠奶茶 (大杯半糖)", price: 65, cal: 650 },
            { id: 4, meal: "晚餐", name: "陽春湯麵 + 茶葉蛋", price: 68, cal: 455 }
        ];
        saveAndRefresh();
    }

    // 儲存至 LocalStorage 並更新畫面
    function saveAndRefresh() {
        localStorage.setItem('eat_budget_records', JSON.stringify(records));
        updateUI();
    }

    // 重設表單輸入框
    function resetForm() {
        document.getElementById('food-name').value = '';
        document.getElementById('food-price').value = '';
        document.getElementById('food-cal').value = '';
        document.getElementById('autocomplete-list').style.display = 'none';
    }

    // 核心更新 UI 與圖表
    function updateUI() {
        const container = document.getElementById('record-list-container');
        
        let totalSpent = 0;
        let totalCalories = 0;

        records.forEach(r => {
            totalSpent += r.price;
            totalCalories += r.cal;
        });

        document.getElementById('total-spent').innerText = totalSpent;
        document.getElementById('total-calories').innerText = totalCalories;

        const budgetLeft = userBudget - totalSpent;
        const calorieLeft = userCalorieLimit - totalCalories;

        document.getElementById('budget-left').innerText = budgetLeft;
        document.getElementById('calorie-left').innerText = calorieLeft;

        updateProgressBar('budget', totalSpent, userBudget, '元');
        updateProgressBar('calorie', totalCalories, userCalorieLimit, 'kcal');

        if (records.length === 0) {
            container.innerHTML = `<div class="empty-state">目前還沒有新增飲食紀錄，趕快記錄今天吃了什麼吧！</div>`;
        } else {
            container.innerHTML = records.map(r => `
                <div class="record-item">
                    <div class="record-info">
                        <div>[${r.meal}] ${r.name}</div>
                    </div>
                    <div class="record-right">
                        <div class="record-price-cal">
                            <div>$${r.price}元</div>
                            <div style="color: var(--text-secondary);">${r.cal} kcal</div>
                        </div>
                        <button class="delete-btn" onclick="deleteRecord(${r.id})" title="刪除">✕</button>
                    </div>
                </div>
            `).join('');
        }

        updateCharts();
    }

    // 更新單一進度條狀態
    function updateProgressBar(type, current, limit, unit) {
        const bar = document.getElementById(`${type}-progress`);
        const statusText = document.getElementById(`${type}-status-text`);
        
        if (limit <= 0) {
            bar.style.width = '0%';
            return;
        }

        let percentage = (current / limit) * 100;
        let cappedPercentage = Math.min(percentage, 100);
        bar.style.width = `${cappedPercentage}%`;

        if (percentage < 80) {
            bar.style.backgroundColor = 'var(--primary-green)';
            statusText.innerText = '🟢 狀態良好';
            statusText.style.color = 'var(--primary-green)';
        } else if (percentage <= 100) {
            bar.style.backgroundColor = '#E9C46A';
            statusText.innerText = '🟡 接近上限';
            statusText.style.color = '#B58900';
        } else {
            bar.style.backgroundColor = 'var(--danger-red)';
            statusText.innerText = `🔴 已超標 ${current - limit} ${unit}！`;
            statusText.style.color = 'var(--danger-red)';
        }
    }

    // 更新 Canvas 圓餅圖
    function updateCharts() {
        const mealTypes = ['早餐', '午餐', '晚餐', '點心/飲料'];
        
        let costData = [0, 0, 0, 0];
        let calorieData = [0, 0, 0, 0];

        records.forEach(r => {
            const index = mealTypes.indexOf(r.meal);
            if (index !== -1) {
                costData[index] += r.price;
                calorieData[index] += r.cal;
            }
        });

        const chartColors = ['#5B8C5A', '#E88D67', '#F4D35E', '#6A9BC3'];

        if (costChartInstance) costChartInstance.destroy();
        if (calorieChartInstance) calorieChartInstance.destroy();

        const costCtx = document.getElementById('costChart').getContext('2d');
        costChartInstance = new Chart(costCtx, {
            type: 'doughnut',
            data: {
                labels: mealTypes,
                datasets: [{
                    data: costData,
                    backgroundColor: chartColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });

        const calCtx = document.getElementById('calorieChart').getContext('2d');
        calorieChartInstance = new Chart(calCtx, {
            type: 'doughnut',
            data: {
                labels: mealTypes,
                datasets: [{
                    data: calorieData,
                    backgroundColor: chartColors,
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } }
            }
        });
    }
</script>
